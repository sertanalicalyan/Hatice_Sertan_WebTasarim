<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Ezberleme - Çalışma Modu</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <div class="header-sol">
            <button id="menu-buton" class="menu-buton">☰</button>
            <h1><a href="./index.html" class="logo-link">Kelime Ezberleme</a></h1>
        </div>
        
        <nav id="yan-menu" class="yan-menu">
            <div class="menu-baslik">Kelime Ezberleme</div>
            
            <a href="./index.html">Ana Sayfa</a>
            <a href="./listeler.html">Listelerim</a>
            <a href="./kartlar.html">Kart Yönetimi</a>
            <a href="./calis.html">Çalışma Modu</a>
            <a href="./ilerleme.html">İlerleme Takibi</a>
        </nav>
    </header>

    <main>
        <button class="btn-geri" onclick="history.back()">⬅ Geri Dön</button>
        <section id="calisma-alani">
            <h2>Çalışma Modu</h2>
            
            <div class="calisma-ayarlari">
                <select id="calisma-liste-secici" style="margin-right: 1rem; border-color: var(--renk-birincil); font-weight: bold;">
                    </select>
                
                <select id="mod-secici">
                    <option value="sirali">Sıralı</option>
                    <option value="rastgele">Rastgele (Fisher-Yates)</option>
                    <option value="yanlislar">Yalnızca Yanlışlar</option>
                </select>
                <div class="ilerleme-konteyner">
                    <div id="ilerleme-cubugu"></div>
                </div>
            </div>

            <div class="kart-sahnesi">
                <div class="kart" id="aktif-kart">
                    <div class="kart-yuz kart-on">
                        <p>Ön Yüz (Kelime)</p>
                    </div>
                    <div class="kart-yuz kart-arka">
                        <p>Arka Yüz (Anlamı)</p>
                    </div>
                </div>
            </div>

            <div class="aksiyon-butonlari">
                <button id="btn-yanlis">Yanlış (Sol Ok)</button>
                <button id="btn-dogru">Doğru (Sağ Ok)</button>
            </div>

        </section>
    
    <div id="modal-oturum-bitti" class="modal-arkaplan" style="display: none;">
            <div class="modal-icerik" style="text-align: center;">
                <div style="font-size: 4rem; margin-bottom: 0.5rem;">🎉</div>
                <h3 style="font-size: 1.6rem; color: var(--renk-ikincil); margin-bottom: 1rem;">Oturum Tamamlandı!</h3>
                
                <div style="display: flex; justify-content: space-around; margin-bottom: 1.5rem; background: #f1f5f9; padding: 1rem; border-radius: var(--radius-kucuk);">
                    <div>
                        <span style="display: block; font-size: 1.8rem; font-weight: bold; color: var(--renk-basari);" id="modal-sonuc-dogru">0</span>
                        <span style="font-size: 0.95rem; color: var(--renk-metin-acik); font-weight: 500;">Doğru</span>
                    </div>
                    <div>
                        <span style="display: block; font-size: 1.8rem; font-weight: bold; color: var(--renk-hata);" id="modal-sonuc-yanlis">0</span>
                        <span style="font-size: 0.95rem; color: var(--renk-metin-acik); font-weight: 500;">Yanlış</span>
                    </div>
                </div>
                
                <p style="font-size: 1.05rem; line-height: 1.5; margin-bottom: 1.5rem; color: var(--renk-metin);" id="modal-sonuc-mesaj"></p>
                
                <div style="display: flex; flex-direction: column; gap: 0.8rem;">
                    <button class="btn-hata" id="btn-yanlislardan-devam" style="display: none; background-color: var(--renk-hata); color: white; padding: 0.8rem; border-radius: var(--radius-kucuk); border: none; font-weight: 600; cursor: pointer; transition: 0.2s;">
                        Yalnızca Yanlışlardan Devam Et
                    </button>
                    <button class="btn-ana" onclick="window.calismayiBaslat()" onclick="modalKapat('modal-oturum-bitti')">Aynı Listeyi Tekrar Çöz</button>
                    <button class="btn-ikincil" onclick="window.location.href='./index.html'" style="background-color: transparent; color: var(--renk-metin-acik); border: 1px solid #cbd5e1;">Ana Sayfaya Dön</button>
                </div>
            </div>
        </div>

    </main>


    <footer>
        <p>2026 - Web Tasarım Final Projesi</p>
    </footer>

    <script src="./script.js" defer></script>
</body>
</html>
