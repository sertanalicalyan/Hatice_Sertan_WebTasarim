<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Ezberleme - Listelerim</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <div class="header-sol">
            <button id="menu-buton" class="menu-buton">☰</button>
            <h1><a href="./index.html" class="logo-link">Kelime Ezberleme</a></h1>
        </div>
        
        <nav id="yan-menu" class="yan-menu">
            <div class="menu-baslik">Kelime Ezberleme</div>
            <a href="./index.html">Ana Sayfa</a>
            <a href="./listeler.html">Listelerim</a>
            <a href="./kartlar.html">Kart Yönetimi</a>
            <a href="./calis.html">Çalışma Modu</a>
            <a href="./ilerleme.html">İlerleme Takibi</a>
        </nav>
    </header>

    <main>
        <button class="btn-geri" onclick="history.back()">⬅ Geri Dön</button>
        
        <section id="listeler-yonetimi">
            <h2>Listelerim</h2>

            <div class="kontrol-alani">
                <div class="arama-grup">
                    <label for="liste-arama">Listelerde Ara:</label>
                    <input type="text" id="liste-arama" placeholder="Liste adı veya dil ara...">
                </div>
                <div class="filtre-grup">
                    <label for="kategori-filtre">Kategoriye Göre Filtrele:</label>
                    <select id="kategori-filtre">
                        <option value="hepsi">Tüm Kategoriler</option>
                        <option value="dil">Dil Öğrenimi</option>
                        <option value="yazilim">Yazılım / Bilim</option>
                        <option value="genel">Genel Kültür</option>
                        <option value="diger">Diğer</option>
                    </select>
                </div>
            </div>

            <div class="listeler-duzeni" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
                
                <div class="listeler-goruntuleme">
                    <div id="listeler-konteyner" class="listeler-izgarasi">
                        </div>
                </div>

                <div id="yeni-liste-buton-kapsayici" style="text-align: center; margin: 2rem 0;">
                    <button id="btn-yeni-liste-ac" class="btn-ana" style="align-self: center;">+ Yeni Liste Oluştur</button>
                </div>

                <div class="form-kutu" id="yeni-liste-form-alani" style="display: none; max-width: 600px; margin: 0 auto; width: 100%;">
                    <h3>Yeni Liste Oluştur</h3>
                    <form id="yeni-liste-formu">
                        <div class="form-grup">
                            <label for="liste-adi">Liste Adı:</label>
                            <input type="text" id="liste-adi" required placeholder="Örn: İngilizce İleri Seviye">
                        </div>
                        <div class="form-grup">
                            <label for="liste-dili">Dil / Konu:</label>
                            <input type="text" id="liste-dili" required placeholder="Örn: İngilizce, İspanyolca, Terimler">
                        </div>
                        <div class="form-grup">
                            <label for="liste-kategori">Kategori:</label>
                            <select id="liste-kategori" required>
                                <option value="dil">Dil Öğrenimi</option>
                                <option value="yazilim">Yazılım / Bilim</option>
                                <option value="genel">Genel Kültür</option>
                                <option value="diger">Diğer</option>
                            </select>
                        </div>
                        <div class="form-grup">
                            <label for="liste-renk">Tema Rengi:</label>
                            <input type="color" id="liste-renk" value="#3498db">
                        </div>
                        <div class="form-grup">
                            <label for="liste-emoji">İkon (Emoji):</label>
                            <input type="text" id="liste-emoji" placeholder="Örn: 🇬🇧, 💻, 📚" maxlength="2" required>
                        </div>
                        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                            <button type="submit" class="btn-ekle">Liste Oluştur</button>
                            <button type="button" class="btn-ikincil" id="btn-form-iptal">İptal</button>
                        </div>
                    </form>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>2026 - Web Tasarım Final Projesi</p>
    </footer>

    <script src="./script.js" defer></script>
</body>
</html>
